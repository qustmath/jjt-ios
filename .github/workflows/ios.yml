name: iOS

on:
  # 代码推送：只跑模拟器编译验证（不需要任何 Secrets）
  push:
    branches: [master, main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  # 手动触发：可选跑 TestFlight 发布（需要 Secrets 齐备）
  workflow_dispatch:
    inputs:
      release:
        description: "上传 TestFlight（true/false）"
        required: true
        default: "false"

jobs:
  # ── 编译验证：任何推送都跑，不需要付费账号 ─────────────────
  build-simulator:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: cocoapods-${{ hashFiles('Podfile.lock') }}
          restore-keys: cocoapods-

      - name: Build (simulator, unsigned)
        run: |
          xcodegen
          # CocoaPods trunk CDN 偶发 429（raw.githubusercontent.com 限流），递增退避重试 5 次；
          # 重试耗尽必须 fail-fast（for 循环末次是 sleep，退出码恒 0，需显式 exit 1）
          ok=0
          for i in 1 2 3 4 5; do
            pod install && { ok=1; break; }
            s=$((30 * i))
            echo "pod install 失败（第 $i 次），${s}s 后重试…"
            sleep $s
          done
          [ $ok -eq 1 ] || { echo "pod install 重试 5 次仍失败"; exit 1; }
          set -o pipefail
          xcodebuild -workspace JJT.xcworkspace -scheme JJT \
            -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/build.log

      # 编译失败时把 Swift error 行写进 Job Summary（公开可见，无需登录即可在 job 页读到）
      - name: Summarize build errors
        if: failure()
        run: |
          if [ -f /tmp/build.log ]; then
            {
              echo "## Swift errors"
              echo '```'
              grep -E "error:" /tmp/build.log | sort -u | head -80
              echo '```'
              echo "## Full log tail"
              echo '```'
              tail -100 /tmp/build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # 同时以注解形式上报前 10 条（公开 API 可读，无需登录）
            grep -E "error:" /tmp/build.log | sort -u | head -10 | while IFS= read -r line; do
              echo "::error::${line:0:600}"
            done
          fi

  # ── TestFlight 发布：仅手动触发且 release=true ─────────────
  beta:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Write App Store Connect API key
        run: echo "$APP_STORE_CONNECT_API_KEY_B64" | base64 -d > fastlane/AuthKey.p8
        env:
          APP_STORE_CONNECT_API_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_B64 }}

      - name: Bundle install
        run: bundle install

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: cocoapods-${{ hashFiles('Podfile.lock') }}
          restore-keys: cocoapods-

      - name: fastlane beta
        run: bundle exec fastlane beta
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APP_IDENTIFIER: ${{ secrets.APP_IDENTIFIER }}
