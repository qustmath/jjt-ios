name: JJT
options:
  bundleIdPrefix: online.tuxiansheng
  # 按 Xcode 15.4 格式生成工程（新版 XcodeGen 默认 Xcode 16 格式，旧 Xcode 打不开）
  xcodeVersion: "15.4"
  deploymentTarget:
    # 17.0 起步：竖滑视频流需要 scrollTargetBehavior/scrollPosition（iOS 17+）
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  JJT:
    type: application
    platform: iOS
    sources:
      - path: JJT
        excludes:
          # Resources 单独按文件夹引用打包（保持目录结构，避免黑白表情包同名文件扁平化冲突）
          - "Resources/**"
      - path: JJT/Resources/stickers
        type: folder
      - path: JJT/Resources/posters
        type: folder
    info:
      path: JJT/Info.plist
      properties:
        CFBundleDisplayName: 荆棘兔子
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: 用于在首页展示你所在的城市
        # 扫一扫（首页/我的页扫码加好友、识帖）
        NSCameraUsageDescription: 用于扫码识别二维码
        # 拉起支付宝收银台（充值）
        LSApplicationQueriesSchemes: [alipays]
        # 对齐安卓 usesCleartextTraffic=true：历史数据存在 http 图片（OSS/CDN），
        # ATS 默认拦截会导致轮播/头像全黑；提审时在审核备注里说明即可
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.tuxiansheng.jjt
        # 个人开发者 Team ID（苹果后台 Membership details 里 10 位字符），本地/CI 均可由
        # `xcodebuild DEVELOPMENT_TEAM=xxx` 或 fastlane 覆盖，这里默认留空即可编译模拟器包
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Automatic
