name: JJT
options:
  bundleIdPrefix: online.tuxiansheng
  # 按 Xcode 15.4 格式生成工程（新版 XcodeGen 默认 Xcode 16 格式，旧 Xcode 打不开）
  xcodeVersion: "15.4"
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  JJT:
    type: application
    platform: iOS
    sources:
      - path: JJT
    info:
      path: JJT/Info.plist
      properties:
        CFBundleDisplayName: 荆棘兔子
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: 用于在首页展示你所在的城市
        # 对齐安卓 usesCleartextTraffic=true：历史数据存在 http 图片（OSS/CDN），
        # ATS 默认拦截会导致轮播/头像全黑；提审时在审核备注里说明即可
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.tuxiansheng.jjt
        # 个人开发者 Team ID（苹果后台 Membership details 里 10 位字符），本地/CI 均可由
        # `xcodebuild DEVELOPMENT_TEAM=xxx` 或 fastlane 覆盖，这里默认留空即可编译模拟器包
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Automatic
